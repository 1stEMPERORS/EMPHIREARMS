<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog — EMPHIREARMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="page-catalog">

<nav>
  <a class="brand" href="index.html">
    <img src="assets/logo/logo.png" alt="EMPHIREARMS logo">
    <div>
      <div class="brand-text">EMPHIREARMS</div>
      <span class="brand-sub">Daemones Imperatoris</span>
    </div>
  </a>
  <div class="nav-right">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Back to site
    </a>
  </div>
</nav>

<div class="page-head">
  <div class="wrap">
    <span class="tag">Full Inventory</span>
    <h1>Catalog</h1>
  </div>
</div>

<div id="status" class="wrap">Loading products from Google Sheets...</div>

<main class="wrap">
  <div class="grid" id="grid" style="display:none;"></div>
</main>

<footer>
  Prototype demo — checkout is not connected to real payment.
</footer>

<script>
  // =========================================================
  // GOOGLE SHEETS CONFIG
  // =========================================================

  const SHEET_ID = "1n_DzAbTaOSeER8H_eTRhymuwwSvFFkMZ7H1FrZko1jw";
  const SHEET_NAME = "Sheet1";


  // =========================================================
  // ELEMENTS
  // =========================================================

  const statusEl = document.getElementById("status");
  const gridEl = document.getElementById("grid");


  // =========================================================
  // MONEY
  // =========================================================

  function money(value) {
    const number = parseFloat(
      String(value).replace(/[^0-9.-]/g, "")
    );

    if (Number.isNaN(number)) {
      return "$0.00";
    }

    return "$" + number.toFixed(2);
  }


  // =========================================================
  // LOAD PRODUCTS
  // =========================================================

  async function loadProducts() {

    statusEl.classList.remove("error");
    statusEl.textContent = "Loading products from Google Sheets...";

    const url =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

    try {

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          `Google Sheets returned HTTP ${response.status}.`
        );
      }

      const text = await response.text();

      // Google wraps the JSON response in:
      // google.visualization.Query.setResponse(...)
      const match = text.match(
        /google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/
      );

      if (!match) {
        console.error("Google response:", text);

        throw new Error(
          "Could not read the Google Sheets response."
        );
      }

      const json = JSON.parse(match[1]);

      if (!json.table || !json.table.rows) {
        throw new Error(
          "Google Sheets returned no table data."
        );
      }

      const rows = json.table.rows;


      // =====================================================
      // READ HEADERS FROM GOOGLE'S COLUMN METADATA
      // (gviz splits the header row out into json.table.cols,
      // so rows[] only ever contains actual product data)
      // =====================================================

      if (!json.table.cols || json.table.cols.length === 0) {
        throw new Error(
          "The Google Sheet has no columns."
        );
      }

      const headers = json.table.cols.map(col => {
        return String(col.label || "").trim().toLowerCase();
      });

      console.log("Detected headers:", headers);


      // =====================================================
      // FIND COLUMNS
      // =====================================================

      const idx = {
        image: headers.indexOf("image"),
        name: headers.indexOf("name"),
        description: headers.indexOf("description"),
        price: headers.indexOf("price")
      };


      console.log("Column indexes:", idx);


      // Name and price are required
      if (
        idx.name === -1 ||
        idx.price === -1
      ) {

        throw new Error(
          `Couldn't find Name and Price columns. Detected headers: ${headers.join(", ") || "(none — is row 1 blank?)"}`
        );
      }


      // =====================================================
      // READ PRODUCTS (every row here is real data,
      // no header row to skip)
      // =====================================================

      const products = rows
        .map((row, index) => {

          function get(columnIndex) {

            if (
              columnIndex === -1 ||
              !row.c ||
              !row.c[columnIndex]
            ) {
              return "";
            }

            return row.c[columnIndex].f ??
                   row.c[columnIndex].v ??
                   "";
          }


          const image =
            String(get(idx.image)).trim();

          const name =
            String(get(idx.name)).trim();

          const description =
            String(get(idx.description)).trim();

          const price =
            parseFloat(
              String(get(idx.price))
                .replace(/[^0-9.-]/g, "")
            );


          return {
            key: "p" + (index + 1),
            image: image,
            name: name,
            description: description,
            price: Number.isFinite(price)
              ? price
              : 0
          };

        })
        .filter(product => {

          return product.name !== "";

        });


      // =====================================================
      // NO PRODUCTS
      // =====================================================

      if (products.length === 0) {

        statusEl.textContent =
          "The sheet loaded, but no product rows were found.";

        return;
      }


      // =====================================================
      // DISPLAY PRODUCTS
      // =====================================================

      console.log("Products loaded:", products);

      renderProducts(products);

      statusEl.style.display = "none";

      gridEl.style.display = "grid";

    }

    catch (error) {

      console.error(
        "Google Sheets loading error:",
        error
      );

      statusEl.classList.add("error");

      statusEl.innerHTML =
        "⚠️ Couldn't load inventory" +
        "<br>" +
        escapeHtml(error.message);

    }

  }


  // =========================================================
  // RENDER PRODUCTS
  // =========================================================

  function renderProducts(products) {

    gridEl.innerHTML = products.map(product => {

      const imageHTML = product.image
        ? `
          <img
            src="${escapeAttribute(product.image)}"
            alt="${escapeAttribute(product.name)}"
            onerror="this.parentElement.innerHTML='<span class=&quot;fallback&quot;>no image</span>'"
          >
        `
        : `
          <span class="fallback">
            no image
          </span>
        `;


      return `
        <div class="tag">

          <div class="tag-photo">
            ${imageHTML}
          </div>

          <div class="tag-body">

            <span class="sku">
              SKU-${product.key.toUpperCase()}
            </span>

            <h3 class="tag-name">
              ${escapeHtml(product.name)}
            </h3>

            <p class="tag-desc">
              ${escapeHtml(product.description)}
            </p>

            <div class="tag-footer">

              <span class="price">
                ${money(product.price)}
              </span>

              <button
                class="add-btn"
              >
                ADD
              </button>

            </div>

          </div>

        </div>
      `;

    }).join("");

  }


  // =========================================================
  // ESCAPE HTML
  // =========================================================

  function escapeHtml(value) {

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
  }


  // =========================================================
  // ESCAPE ATTRIBUTE
  // =========================================================

  function escapeAttribute(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }


  // =========================================================
  // START
  // =========================================================

  loadProducts();

</script>

</body>
</html>
